# API interna del Signing Gateway. Solo la plataforma llega al 8443 (firewalld, zona «privada»).
# El certificado lo genera y rota gateway-tls-rotate (deploy/tls-rotate.sh).
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/gateway/tls/current.crt;
    ssl_certificate_key /etc/gateway/tls/current.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/gateway/public;
    index index.php;
    client_max_body_size 25m;

    location / { try_files $uri /index.php?$query_string; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/gateway.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }
}
